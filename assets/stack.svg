<svg viewBox="0 0 1000 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Section 02 — stack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { --bone: #1a1a1a; --rule: #C0C0C0; --muted: #767676; --dim: #999999; --accent: #444444; --ghost: #D6D6D6; }
    @media (prefers-color-scheme: dark) { :root { --bone: #E4E4E4; --rule: #3A3A3A; --muted: #8A8A8A; --dim: #6E6E6E; --accent: #B5B5B5; --ghost: #2A2A2A; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 760; stroke-dashoffset: 760; animation: d 1.2s cubic-bezier(.6,0,.2,1) .1s forwards; }
    @keyframes d { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
    .a0{animation-delay:.05s} .a1{animation-delay:.15s} .a2{animation-delay:.25s} .a3{animation-delay:.35s} .a4{animation-delay:.45s} .a5{animation-delay:.55s} .a6{animation-delay:.65s}
    @media (prefers-reduced-motion: reduce) { .draw,.rise { animation: none; } .draw{stroke-dashoffset:0} .rise{opacity:1} }
  </style>

  <g class="rise a0">
    <text class="mono" x="48" y="46" font-size="46" fill="var(--ghost)">02</text>
    <text class="mono" x="118" y="38" font-size="13" fill="var(--accent)" letter-spacing="6">STACK</text>
    <text class="mono" x="952" y="38" font-size="11" fill="var(--muted)" letter-spacing="2" text-anchor="end">~/02-stack</text>
  </g>
  <line class="draw a0" x1="205" y1="33" x2="831" y2="33"/>

  <text class="mono rise a1" x="48" y="90" font-size="11" fill="var(--muted)" letter-spacing="2.5">LANGUAGES</text>
  <text class="mono rise a1" x="220" y="90" font-size="15" fill="var(--bone)">C · C++ · Python · JavaScript · TypeScript</text>

  <text class="mono rise a2" x="48" y="126" font-size="11" fill="var(--muted)" letter-spacing="2.5">BACKEND</text>
  <text class="mono rise a2" x="220" y="126" font-size="15" fill="var(--bone)">FastAPI · Express.js · Pydantic · pytest</text>

  <text class="mono rise a3" x="48" y="162" font-size="11" fill="var(--muted)" letter-spacing="2.5">WEB</text>
  <text class="mono rise a3" x="220" y="162" font-size="15" fill="var(--bone)">HTML5 · CSS3 · Next.js · Node.js · Tailwind CSS</text>

  <text class="mono rise a4" x="48" y="198" font-size="11" fill="var(--muted)" letter-spacing="2.5">DATA &amp; ML</text>
  <text class="mono rise a4" x="220" y="198" font-size="15" fill="var(--bone)">pandas · NumPy · scikit-learn · OpenCV</text>

  <text class="mono rise a5" x="48" y="234" font-size="11" fill="var(--muted)" letter-spacing="2.5">DATABASE</text>
  <text class="mono rise a5" x="220" y="234" font-size="15" fill="var(--bone)">PostgreSQL · Supabase</text>

  <line class="rise a5" x1="48" y1="262" x2="952" y2="262" stroke="var(--rule)" stroke-width="1" opacity=".5"/>

  <text class="mono rise a6" x="48" y="296" font-size="11" fill="var(--muted)" letter-spacing="2.5">TOOLS</text>
  <text class="mono rise a6" x="220" y="296" font-size="15" fill="var(--bone)">Docker · Git · GitHub · VS Code</text>
</svg>
