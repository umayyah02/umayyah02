<svg viewBox="0 0 1000 140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Current status and contact" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { --bone: #1a1a1a; --rule: #C0C0C0; --muted: #767676; --accent: #444444; --ghost: #D6D6D6; }
    @media (prefers-color-scheme: dark) { :root { --bone: #E4E4E4; --rule: #3A3A3A; --muted: #8A8A8A; --accent: #B5B5B5; --ghost: #2A2A2A; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
    .a1{animation-delay:.05s} .a2{animation-delay:.2s} .a3{animation-delay:.35s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>

  <line class="rise a1" x1="48" y1="30" x2="952" y2="30" stroke="var(--rule)" stroke-width="1"/>

  <text class="mono rise a2" x="48" y="68" font-size="11" fill="var(--muted)" letter-spacing="2.5">OPEN TO</text>
  <text class="mono rise a2" x="154" y="68" font-size="15" fill="var(--bone)">internships · collaboration · backend &amp; AI/ML roles</text>

  <text class="mono rise a3" x="48" y="102" font-size="11" fill="var(--muted)" letter-spacing="2.5">CONTACT</text>
  <text class="mono rise a3" x="154" y="102" font-size="15" fill="var(--accent)">umayyahnoor27@gmail.com</text>

  <text class="mono rise a3" x="952" y="102" font-size="11" fill="var(--muted)" letter-spacing="2" text-anchor="end">karachi, pk · updated 2026</text>
</svg>
