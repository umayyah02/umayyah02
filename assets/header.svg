<svg viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Umayyah — Backend and AI/ML Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { --bone: #1a1a1a; --rule: #C0C0C0; --muted: #767676; --dim: #999999; --accent: #444444; }
    @media (prefers-color-scheme: dark) { :root { --bone: #E4E4E4; --rule: #3A3A3A; --muted: #8A8A8A; --dim: #6E6E6E; --accent: #B5B5B5; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.3s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1{animation-delay:.1s} .a2{animation-delay:.4s} .a3{animation-delay:.75s} .a4{animation-delay:1.05s} .a5{animation-delay:1.3s} .a6{animation-delay:1.55s}
    @media (prefers-reduced-motion: reduce) { .draw,.rise,.fade { animation: none; } .draw{stroke-dashoffset:0} .rise,.fade{opacity:1} }
  </style>

  <line class="draw a1" x1="48" y1="56" x2="952" y2="56" stroke="var(--rule)" stroke-width="1"/>
  <g class="fade a1">
    <text class="mono" fill="var(--muted)" x="48" y="42" font-size="11" letter-spacing="3.5">PORTFOLIO — INDEX Nº 001</text>
    <text class="mono" fill="var(--muted)" x="952" y="42" font-size="11" letter-spacing="3.5" text-anchor="end">KARACHI, PK — 24.86° N</text>
  </g>

  <g class="rise a2">
    <text fill="var(--bone)" class="mono" x="46" y="168" font-size="66" letter-spacing="-1.5">Umayyah</text>
  </g>
  <g class="fade a3">
    <text fill="var(--muted)" class="mono" x="48" y="204" font-size="18">Backend &amp; AI/ML Engineer in progress — CS student, Karachi.</text>
  </g>

  <g class="fade a4">
    <text fill="var(--dim)" class="mono" x="48" y="252" font-size="12.5" letter-spacing="1">focus  ▸</text>
    <text fill="var(--accent)" class="mono" x="128" y="252" font-size="12.5" letter-spacing="1">backend systems · APIs · ML integration · full-stack development</text>
  </g>
  <g class="fade a5">
    <text fill="var(--dim)" class="mono" x="48" y="276" font-size="12.5" letter-spacing="1">open to backend / AI engineering internships</text>
  </g>

  <line class="draw a5" x1="48" y1="242" x2="0" y2="242" stroke="none"/>
  <line class="draw a6" x1="48" y1="292" x2="952" y2="292" stroke="var(--rule)" stroke-width="1"/>
</svg>
