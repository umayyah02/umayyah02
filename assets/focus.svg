<svg viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Section 03 — focus" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { --bone: #1a1a1a; --rule: #C0C0C0; --muted: #767676; --dim: #999999; --accent: #444444; --ghost: #D6D6D6; }
    @media (prefers-color-scheme: dark) { :root { --bone: #E4E4E4; --rule: #3A3A3A; --muted: #8A8A8A; --dim: #6E6E6E; --accent: #B5B5B5; --ghost: #2A2A2A; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 760; stroke-dashoffset: 760; animation: d 1.2s cubic-bezier(.6,0,.2,1) .1s forwards; }
    @keyframes d { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
    .a0{animation-delay:.05s} .a1{animation-delay:.18s} .a2{animation-delay:.31s} .a3{animation-delay:.44s} .a4{animation-delay:.57s}
    @media (prefers-reduced-motion: reduce) { .draw,.rise { animation: none; } .draw{stroke-dashoffset:0} .rise{opacity:1} }
  </style>

  <g class="rise a0">
    <text class="mono" x="48" y="46" font-size="46" fill="var(--ghost)">03</text>
    <text class="mono" x="118" y="38" font-size="13" fill="var(--accent)" letter-spacing="6">FOCUS</text>
    <text class="mono" x="952" y="38" font-size="11" fill="var(--muted)" letter-spacing="2" text-anchor="end">~/03-focus</text>
  </g>
  <line class="draw a0" x1="205" y1="33" x2="831" y2="33"/>

  <text class="mono rise a1" x="48" y="92" font-size="15" fill="var(--bone)">▸ shipping backend systems that hold up end-to-end, not just in a demo.</text>
  <text class="mono rise a2" x="48" y="128" font-size="15" fill="var(--bone)">▸ learning to think in APIs, data models, and deployment — not just scripts.</text>
  <text class="mono rise a3" x="48" y="164" font-size="15" fill="var(--bone)">▸ contributing to open-source projects to get comfortable with real codebases.</text>

  <line class="rise a4" x1="48" y1="192" x2="952" y2="192" stroke="var(--rule)" stroke-width="1" opacity=".5"/>

  <text class="mono rise a4" x="48"  y="226" font-size="11" fill="var(--muted)" letter-spacing="2.5">AIMING FOR</text>
  <text class="mono rise a4" x="185" y="226" font-size="15" fill="var(--accent)">a backend / AI engineering internship</text>
</svg>
