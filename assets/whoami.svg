<svg viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Section 01 — whoami" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { --bone: #1a1a1a; --rule: #C0C0C0; --muted: #767676; --dim: #999999; --accent: #444444; --ghost: #D6D6D6; }
    @media (prefers-color-scheme: dark) { :root { --bone: #E4E4E4; --rule: #3A3A3A; --muted: #8A8A8A; --dim: #6E6E6E; --accent: #B5B5B5; --ghost: #2A2A2A; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 760; stroke-dashoffset: 760; animation: d 1.2s cubic-bezier(.6,0,.2,1) .1s forwards; }
    @keyframes d { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
    .a1{animation-delay:.05s} .a2{animation-delay:.15s} .a3{animation-delay:.28s} .a4{animation-delay:.42s} .a5{animation-delay:.55s} .a6{animation-delay:.68s} .a7{animation-delay:.8s}
    @media (prefers-reduced-motion: reduce) { .draw,.rise { animation: none; } .draw{stroke-dashoffset:0} .rise{opacity:1} }
  </style>

  <g class="rise a1">
    <text class="mono" x="48" y="46" font-size="46" fill="var(--ghost)">01</text>
    <text class="mono" x="118" y="38" font-size="13" fill="var(--accent)" letter-spacing="6">WHOAMI</text>
    <text class="mono" x="952" y="38" font-size="11" fill="var(--muted)" letter-spacing="2" text-anchor="end">~/01-whoami</text>
  </g>
  <line class="draw a1" x1="238" y1="33" x2="831" y2="33"/>

  <text class="mono rise a2" x="48" y="96" font-size="16" fill="var(--bone)">computer science student — entering second year, focused on backend and AI/ML engineering.</text>
  <text class="mono rise a3" x="48" y="124" font-size="16" fill="var(--bone)">building end-to-end — from API design to deployment, not just following tutorials.</text>
  <text class="mono rise a4" x="48" y="152" font-size="15" fill="var(--muted)">prefers understanding fundamentals deeply before moving fast.</text>

  <line class="rise a5" x1="48" y1="180" x2="952" y2="180" stroke="var(--rule)" stroke-width="1" opacity=".5"/>

  <text class="mono rise a5" x="48"  y="214" font-size="11" fill="var(--muted)" letter-spacing="2.5">FOCUS</text>
  <text class="mono rise a5" x="154" y="214" font-size="15" fill="var(--bone)">Backend Systems · AI/ML Integration · Full-Stack Development</text>

  <text class="mono rise a6" x="48"  y="248" font-size="11" fill="var(--muted)" letter-spacing="2.5">LEARNING</text>
  <text class="mono rise a6" x="154" y="248" font-size="15" fill="var(--bone)">Data Structures &amp; Algorithms (C++) · backend architecture · full-stack dev</text>

  <text class="mono rise a7" x="48"  y="282" font-size="11" fill="var(--muted)" letter-spacing="2.5">STATUS</text>
  <text class="mono rise a7" x="154" y="282" font-size="15" fill="var(--accent)">open to backend / AI engineering internships</text>
</svg>
