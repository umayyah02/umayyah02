<svg viewBox="0 0 1000 60" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Section 04 — telemetry" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    :root { --muted: #767676; --accent: #444444; --ghost: #D6D6D6; --rule: #C0C0C0; }
    @media (prefers-color-scheme: dark) { :root { --muted: #8A8A8A; --accent: #B5B5B5; --ghost: #2A2A2A; --rule: #3A3A3A; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>
  <g class="rise">
    <text class="mono" x="48" y="46" font-size="46" fill="var(--ghost)">04</text>
    <text class="mono" x="118" y="38" font-size="13" fill="var(--accent)" letter-spacing="6">TELEMETRY</text>
    <text class="mono" x="952" y="38" font-size="11" fill="var(--muted)" letter-spacing="2" text-anchor="end">~/04-telemetry</text>
  </g>
  <line x1="270" y1="33" x2="831" y2="33" stroke="var(--rule)" stroke-width="1"/>
</svg>
